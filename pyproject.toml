[project]
name = "taskautomation"
version = "0.1.0"
description = "Provides task automation tooling for other projects."
authors = [
  { name = "Daniel Jackson", email = "643707+danielrjackson@users.noreply.github.com" },
]
requires-python = "~=3.13"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
dependencies = [
  "pyyaml>=6.0.3", # YAML parser and emitter
  "types-PyYAML>=6.0.12.20260906", # Type stubs for PyYAML
]


[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["/src/taskautomation"]

[tool.mypy]
files = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
exclude = [".git", ".venv", ".pytest_cache", "__pycache__"]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = [
  "E",   # pycodestyle (style guide enforcement)
  "B",   # bugbear (unnecessary complexity)
  "I",   # isort (import sorting)
  "UP",  # pyupgrade (code modernizations)
  "C90", # mccabe (complexity)
  "D",   # pydocstyle (docstring conventions)
]
ignore = [
  "D211", # no-blank-line-before-class
  "D212", # multi-line-summary-first-line
  "D413", # missing-blank-line-after-last-section
]
future-annotations = true
preview = true

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = [
  "D203", # ignore “one-blank-line before class” in all test files
]

[tool.uv]
package = false
dev-dependencies = [
  "coverage>=7.17.0",     # Test coverage report
  "hypothesis>=6.170.13", # Fuzzy testing
  "mypy>=2.4.1",        # Optional static type checker
  "pydantic>=2.14.1",     # Data validation and parsing
  "pytest>=9.2.0",       # Python testing library
  "pytest-cov>=7.1.0",   # Pytest coverage plugin
  "ruff>=0.17.3",        # Fast Python linter
]
